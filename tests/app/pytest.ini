[pytest]
python_files = test_*.py *_test.py *_tests.py
python_functions = test_*
markers =
    requires_login: marks tests that need user login before execution
    session_1: logged_in_session tests
    session_2: logged_in_session_for_search tests
    session_3: logged_in_session_for_home_page session tests
    mobile_app: Mobile App test cases
    smoke: quick checks for critical flows
    regression: full regression tests
    core: only core flows
    pre_login: Tests that can be run without login
    post_login: Tests that require logged-in user
    user(username): specify which user should be used for login

pythonpath =
    ..

log_cli = true
log_cli_level = INFO
addopts =
    --alluredir=reports/allure-results
    --html=reports/test_report.html
    --self-contained-html
    --tb=no
    -p no:warnings
;    --reruns 2
    --reruns-delay 5
    --junitxml=test_results.xml
