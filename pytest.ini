[pytest]
testpaths =
    tests/api
    tests/web
    tests/app
    tests/mobile_app
    tests/data
    tests/integration
    tests/unit

pythonpath = tests

python_files = test_*.py
python_functions = test_*

markers =
    debug: Debug ATC coding
    smoke: Smoke test cases
    regression: Regression test cases
    api: API test cases
    web: Web UI test case
    web_only: Marks tests that should run only on web platform
    pre_login: Tests that run before logging in
    post_login: Tests that require a logged-in state
    requires_login: Tests that depend on authenticated flows
    search: Search feature validation
    network: Network resilience scenarios
    core: Core functionality regression tests
    guest_user: Scenarios targeting guest user journeys
    android_only: Tests limited to Android platform
    order: Ordered test sequencing
    ui: UI verification scenarios
    new: Newly added scenarios for focused runs
    notifications: Notification feature coverage
    profile: Profile management coverage
    session_2: Secondary session management coverage
    switch_account_ui: Switch account UI scenarios
    stage_1: Stage 1 test cases

log_cli = true
log_cli_level = INFO

# Combined addopts for both Mobile + Web
addopts =
    --alluredir=./reports
    --clean-alluredir
    --html=report.html
    --self-contained-html
